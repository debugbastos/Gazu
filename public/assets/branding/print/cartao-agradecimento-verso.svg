<text x="14" y="44" font-family="'Inter Display', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="5.2" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0">Que bom ter você com a gente.</text>
<text x="14" y="56" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="3.4" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">Cada peça foi conferida e embalada com cuidado</text><text x="14" y="62" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="3.4" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">para chegar até você do jeito certo.</text>
<text x="14" y="80" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.6" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0.4">PRECISA DE AJUDA?</text>
<text x="14" y="88" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="3.1" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">Acompanhe o pedido em Minha conta › Pedidos</text><text x="14" y="93.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="3.1" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">ou fale com a Central de Atendimento no site.</text>
<text x="14" y="108" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.6" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0.4">TROCAS E DEVOLUÇÕES</text>
<text x="14" y="116" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="3.1" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">Solicite pela sua conta. Compras online podem ser</text><text x="14" y="121.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="3.1" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">devolvidas em até 7 dias após o recebimento</text><text x="14" y="126.4" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="3.1" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">(art. 49 do Código de Defesa do Consumidor).</text>
<text x="52.5" y="142" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.6" font-weight="400" fill="#6B6B6B" text-anchor="middle" letter-spacing="0">Moda que se move com você.</text>
</svg>
