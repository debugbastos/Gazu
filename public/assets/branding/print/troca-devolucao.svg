<rect x="12" y="156.4" width="3" height="3" fill="none" stroke="#111111" stroke-width="0.25"/><text x="16.6" y="159" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.6" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">Troca de tamanho/cor</text><rect x="58" y="156.4" width="3" height="3" fill="none" stroke="#111111" stroke-width="0.25"/><text x="62.6" y="159" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.6" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">Devolução (desistência — 7 dias)</text><rect x="12" y="162.9" width="3" height="3" fill="none" stroke="#111111" stroke-width="0.25"/><text x="16.6" y="165.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.6" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">Produto com defeito</text><rect x="58" y="162.9" width="3" height="3" fill="none" stroke="#111111" stroke-width="0.25"/><text x="62.6" y="165.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.6" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">Outro</text>
