<text x="74" y="206" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.2" font-weight="400" fill="#6B6B6B" text-anchor="middle" letter-spacing="0">O reembolso é feito pelo mesmo meio de pagamento, após o recebimento e a conferência da peça.</text>
