<text x="136" y="20" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.6" font-weight="600" fill="#111111" text-anchor="end" letter-spacing="0.5">FORMULÁRIO DE TROCA E DEVOLUÇÃO</text>
<line x1="12" y1="28" x2="136" y2="28" stroke="#111111" stroke-width="0.3"/>
<text x="12" y="37" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="3" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0">Antes de enviar</text>
<text x="12" y="44" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.9" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">1. Abra a solicitação em Minha conta › Pedidos › Solicitar troca ou devolução</text><text x="12" y="49" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.9" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">    (ou pela Central de Atendimento, se comprou sem cadastro).</text><text x="12" y="54" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.9" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">2. Aguarde a aprovação e as instruções de envio por e-mail.</text><text x="12" y="59" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.9" font-weight="400" fill="#111111" text-anchor="start" letter-spacing="0">3. Coloque este formulário preenchido no pacote, com a peça sem uso e com etiquetas.</text>
<text x="12" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.2" font-weight="500" fill="#6B6B6B" text-anchor="start" letter-spacing="0.25">NÚMERO DO PEDIDO</text><line x1="12" y1="74.2" x2="70" y2="74.2" stroke="#111111" stroke-width="0.2"/><text x="78" y="70" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.2" font-weight="500" fill="#6B6B6B" text-anchor="start" letter-spacing="0.25">NÚMERO DA SOLICITAÇÃO</text><line x1="78" y1="74.2" x2="136" y2="74.2" stroke="#111111" stroke-width="0.2"/>
<text x="12" y="82" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.2" font-weight="500" fill="#6B6B6B" text-anchor="start" letter-spacing="0.25">NOME COMPLETO</text><line x1="12" y1="86.2" x2="136" y2="86.2" stroke="#111111" stroke-width="0.2"/>
<text x="12" y="94" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.2" font-weight="500" fill="#6B6B6B" text-anchor="start" letter-spacing="0.25">E-MAIL</text><line x1="12" y1="98.2" x2="88" y2="98.2" stroke="#111111" stroke-width="0.2"/><text x="96" y="94" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.2" font-weight="500" fill="#6B6B6B" text-anchor="start" letter-spacing="0.25">TELEFONE</text><line x1="96" y1="98.2" x2="136" y2="98.2" stroke="#111111" stroke-width="0.2"/>
