<text x="12" y="112" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.4" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0">Produto</text><text x="82" y="112" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.4" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0">Cor</text><text x="106" y="112" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.4" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0">Tam.</text><text x="124" y="112" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="2.4" font-weight="600" fill="#111111" text-anchor="start" letter-spacing="0">Qtd.</text>
